version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "daily"
    # `default-days` must be 1-90, so the only way to opt out of the
    # default 3-day cooldown is to exclude every dependency from it.
    cooldown:
      exclude:
        - "*"
    allow:
      - dependency-name: "nixpkgs-master"
      - dependency-name: "nix-master"
    labels:
      - "auto-merge"
